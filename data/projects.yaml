# Current research projects. Shown as cards on the home page and in full on /research.
- id: mwidar
  title: Detection & Tracking for mWidar Imaging
  short: mWidar tracking
  tags: [Computer vision, Data association, Particle filters]
  summary: >-
    Detecting and tracking moving targets in continuous-capture microwave imagery from mWidar,
    a low-cost radar that images a whole scene at once at thousands of frames per second.
  body: |
    **mWidar** (microwave detection and ranging) replaces expensive radar hardware with simple
    antennas and heavy signal processing. Instead of sweeping one direction at a time, it images an
    entire scene at once, at thousands of frames per second. That makes it attractive for
    counter-UAS work and, eventually, for tracking hypersonic vehicles.

    That speed and low cost come with harder perception problems. Working with high-fidelity mWidar
    simulations, I build the full detector-tracker pipeline:

    - **Detection.** Computer vision and deep learning methods that find targets in microwave images, even when targets are occluded or interfere with one another.
    - **Data association.** Keeping identities consistent across frames when detections are missing, cluttered, or ambiguous.
    - **Estimation.** Predicting target motion with Kalman and particle filters, and quantifying how confident the tracker should be.

    The broader goal is to move sensing from hardware-intensive to software-intensive systems, so
    that capable tracking becomes cheap enough to deploy widely.

- id: fault-detection
  title: Time Series Classification for Satellite Fault Detection
  short: Satellite fault detection
  partner: Trusted Space, Inc.
  tags: [Machine learning, Time series, Spacecraft autonomy]
  summary: >-
    Teaching spacecraft to diagnose their own faults (power, attitude control, propulsion) directly
    from telemetry, without waiting on a ground operator. In partnership with Trusted Space, Inc.
  body: |
    Satellites today rely on ground operators to notice that something has gone wrong. With
    **Trusted Space, Inc.**, I'm developing machine learning methods that classify spacecraft
    telemetry in real time, so a vehicle can recognize faults on its own. Target faults include
    power failures, attitude-control anomalies, and thruster malfunctions.

    Using realistic spacecraft simulations, we train classifiers to recognize fault signatures across
    several subsystems at once. The aim is spacecraft that need less constant human monitoring and
    respond faster when something breaks, which makes missions safer and cheaper to run.
