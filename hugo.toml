baseURL = 'https://ajlabarca.com/'
locale = 'en-US'
title = 'Anthony (AJ) La Barca'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = 'PhD student in Aerospace Engineering at CU Boulder researching Bayesian estimation, multi-target tracking, and fault detection for autonomous systems.'
  role = 'PhD Student, Aerospace Engineering Sciences'
  affiliation = 'University of Colorado Boulder'
  lab = 'COHRINT Lab'
  labURL = 'https://cohrint.info/'
  location = 'Boulder, Colorado'

  # Profile links. Leave a value empty ('') to hide it everywhere on the site.
  email = 'aj.labarca@colorado.edu'
  scholar = 'https://scholar.google.com/citations?user=In_r4EwAAAAJ'
  orcid = '0000-0001-7229-6769'
  github = 'https://github.com/alabarca531'
  linkedin = 'https://www.linkedin.com/in/anthony-la-barca-63b766177'
  personal = 'https://personal.ajlabarca.com'

  # Drop a PDF at static/files/ with this name and a "Download PDF" button appears on the CV page.
  cvPDF = 'files/Anthony_LaBarca_CV.pdf'

[menus]
  [[menus.main]]
    name = 'Research'
    pageRef = '/research'
    weight = 10
  [[menus.main]]
    name = 'Publications'
    pageRef = '/publications'
    weight = 20
  [[menus.main]]
    name = 'CV'
    pageRef = '/cv'
    weight = 30

[imaging]
